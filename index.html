<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Animated Blog App</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<h1>Blog Management System</h1>
  <h2>Day 12 Deployment Updated</h2>

</header>

<section class="form-section">

<form id="blogForm">

<input
type="text"
id="title"
placeholder="Enter Blog Title"
required>

<input
type="text"
id="author"
placeholder="Enter Author Name"
required>

<textarea
id="content"
placeholder="Enter Blog Content"
required></textarea>

<button onclick="addBlog()">Add Blog</button>
  <div id="blogPosts"></div>

</form>

</section>

<section id="blogs">

<h2 class="blog-heading">All Blog Posts</h2>

<div id="blogs"></div>

</section>

<script src="script.js"></script>

</body>

</html>
